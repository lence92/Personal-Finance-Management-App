<div class="min-h-screen bg-slate-50 lg:flex">
  <app-sidebar [mobileOpen]="sidebarOpen()" (navigate)="closeSidebar()" />

  @if (sidebarOpen()) {
    <button
      type="button"
      aria-label="Close navigation menu"
      class="fixed inset-0 z-30 bg-slate-950/40 backdrop-blur-[2px] lg:hidden"
      (click)="closeSidebar()"
    ></button>
  }

  <div class="flex min-h-screen min-w-0 flex-1 flex-col lg:pl-72">
    <app-header (menuToggle)="toggleSidebar()" />
    <main class="flex-1 px-4 py-6 sm:px-6 lg:px-10 lg:py-8">
      <div class="mx-auto w-full max-w-7xl">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
