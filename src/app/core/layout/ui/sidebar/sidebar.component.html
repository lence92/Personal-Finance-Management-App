<aside
  class="fixed inset-y-0 left-0 z-40 flex w-72 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform duration-200 lg:translate-x-0"
  [class.translate-x-0]="mobileOpen"
  aria-label="Main navigation"
>
  <a routerLink="/dashboard" (click)="navigate.emit()" class="flex h-16 items-center gap-3 border-b border-slate-100 px-6 text-lg font-semibold tracking-tight text-slate-950">
    <span class="grid size-10 place-items-center rounded-xl bg-emerald-100">
      <img src="assets/icons/brand-leaf.svg" alt="" class="size-6" />
    </span>
    Evergreen
  </a>

  <div class="flex-1 overflow-y-auto px-4 py-7">
    <p class="px-3 text-xs font-semibold uppercase tracking-[0.14em] text-slate-400">Workspace</p>
    <nav class="mt-3 space-y-1" aria-label="Workspace">
      <a routerLink="/dashboard" routerLinkActive="bg-emerald-50 text-emerald-900" [routerLinkActiveOptions]="{ exact: true }" (click)="navigate.emit()"
        class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 10.5 12 3.75l8.25 6.75v9a.75.75 0 0 1-.75.75h-5.25v-6h-4.5v6H4.5a.75.75 0 0 1-.75-.75v-9Z" /></svg>
        Overview
      </a>
      <a href="#transactions" (click)="navigate.emit()" class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h10M4 17h7M18 14v6m-3-3h6" /></svg>
        Transactions
      </a>
      <a href="#budgets" (click)="navigate.emit()" class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 19.25V4.75A.75.75 0 0 1 4.75 4h14.5a.75.75 0 0 1 .75.75v14.5a.75.75 0 0 1-.75.75H4.75a.75.75 0 0 1-.75-.75ZM8 15l3-3 2 2 4-5" /></svg>
        Budgets
      </a>
      <a href="#goals" (click)="navigate.emit()" class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="size-5" aria-hidden="true"><circle cx="12" cy="12" r="8.25" /><circle cx="12" cy="12" r="4.25" /><circle cx="12" cy="12" r=".75" fill="currentColor" /></svg>
        Savings goals
      </a>
      <a href="#reports" (click)="navigate.emit()" class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 19.25V5m0 14.25h16M8 15v-4m4 4V7m4 8v-6" /></svg>
        Reports
      </a>
    </nav>

    <p class="mt-9 px-3 text-xs font-semibold uppercase tracking-[0.14em] text-slate-400">Preferences</p>
    <nav class="mt-3 space-y-1" aria-label="Preferences">
      <a href="#settings" (click)="navigate.emit()" class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5ZM19.4 13.5a7.7 7.7 0 0 0 0-3l1.2-.94-1.5-2.6-1.47.6a7.9 7.9 0 0 0-2.6-1.5L14.8 4.5h-3l-.24 1.56a7.9 7.9 0 0 0-2.6 1.5l-1.47-.6-1.5 2.6 1.2.94a7.7 7.7 0 0 0 0 3l-1.2.94 1.5 2.6 1.47-.6a7.9 7.9 0 0 0 2.6 1.5l.24 1.56h3l.24-1.56a7.9 7.9 0 0 0 2.6-1.5l1.47.6 1.5-2.6-1.2-.94Z" /></svg>
        Settings
      </a>
      <a href="#help" (click)="navigate.emit()" class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-950">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="size-5" aria-hidden="true"><circle cx="12" cy="12" r="8.25" /><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9a2.25 2.25 0 1 1 3.87 1.57c-.9.9-1.62 1.18-1.62 2.68m0 3h.01" /></svg>
        Help & support
      </a>
    </nav>
  </div>

  <div class="border-t border-slate-100 p-4">
    <div class="rounded-2xl bg-emerald-50 p-4">
      <div class="flex items-center gap-2 text-emerald-900">
        <img src="assets/icons/trend-up.svg" alt="" class="size-5" />
        <p class="text-sm font-semibold">Keep building momentum</p>
      </div>
      <p class="mt-2 text-xs leading-5 text-emerald-900/70">Check in regularly to stay on top of your goals.</p>
    </div>
    <p class="mt-4 px-1 text-xs text-slate-400">Evergreen Finance <span class="float-right">v1.0</span></p>
  </div>
</aside>
